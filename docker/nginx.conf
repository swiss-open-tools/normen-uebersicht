server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # HTML, Daten und Service Worker immer frisch laden, Rest eine Stunde cachen.
    # («expires» statt add_header, damit die Sicherheits-Header oben erhalten bleiben)
    location ~* (\.html|/sw\.js|\.json|normen-data\.js)$ { expires -1; }
    location / { try_files $uri $uri/ =404; expires 1h; }
}
